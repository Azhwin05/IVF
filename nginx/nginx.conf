# Nginx reverse proxy — the ONLY container exposed to the hospital LAN,
# per ARCHITECTURE.md §2.1. Routes /api/* to FastAPI, everything else to
# Next.js. TLS termination happens here; upstream traffic is plain HTTP
# on the internal Docker network.
#
# Production: place real certificates in nginx/certs/ (fullchain.pem,
# privkey.pem) for hmis.archanaivf.in — see docs/deployment/production.md.
# This file's TLS block is commented out by default so the compose stack
# runs immediately in dev without requiring certificates; uncomment for
# staging/production and remove the plain-HTTP server block.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 30M;  # matches MAX_UPLOAD_SIZE_MB with headroom

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream api_upstream {
        server api:8000;
    }

    # ---- Plain HTTP (dev / initial bring-up) ----
    server {
        listen 80;
        server_name hmis.archanaivf.in localhost;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ---- HTTPS (staging / production) ----
    # Uncomment once real certificates exist at nginx/certs/{fullchain,privkey}.pem
    # and change the port-80 server block above to a redirect-only block.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name hmis.archanaivf.in;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Frame-Options "DENY" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
